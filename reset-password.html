<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FoodWorld - Set New Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-8 space-y-5">
    <div class="text-center">
      <div class="w-14 h-14 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl mx-auto mb-2">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2 class="text-xl font-black text-slate-900">Set New Password</h2>
      <p id="userEmailPreview" class="text-xs text-slate-500 font-mono mt-1">Verifying reset code...</p>
    </div>

    <div id="verifyingBox" class="text-center py-6 space-y-2">
      <i class="fa-solid fa-spinner fa-spin text-2xl text-orange-500"></i>
      <p class="text-xs text-slate-500 font-semibold">Verifying secure link...</p>
    </div>

    <div id="errorStateBox" class="hidden p-4 bg-red-50 border border-red-200 rounded-2xl text-center space-y-2">
      <i class="fa-solid fa-triangle-exclamation text-2xl text-red-500"></i>
      <h4 class="text-xs font-black text-red-700">Link Expired or Invalid</h4>
      <p id="errorMessage" class="text-[11px] text-red-600">Yeh password reset link expire ho chuka hai ya pehle use ho gaya hai.</p>
    </div>

    <form id="newPasswordForm" onsubmit="handleConfirmPasswordReset(event)" class="hidden space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">New Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
          <input type="password" id="newPassword" minlength="6" required class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:bg-white focus:ring-2 focus:ring-orange-500 focus:outline-none" placeholder="Min. 6 characters">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Confirm New Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
          <input type="password" id="confirmNewPassword" minlength="6" required class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:bg-white focus:ring-2 focus:ring-orange-500 focus:outline-none" placeholder="Re-type password">
        </div>
      </div>

      <div id="formError" class="hidden p-2.5 rounded-xl bg-red-50 text-red-600 text-xs font-semibold"></div>

      <button type="submit" id="savePassBtn" class="w-full min-h-[46px] py-3 bg-orange-600 hover:bg-orange-500 active:scale-95 text-white font-black rounded-xl text-xs shadow-lg shadow-orange-500/30 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-check"></i>
        <span>Save New Password</span>
      </button>
    </form>

    <div id="successStateBox" class="hidden p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-center space-y-3">
      <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl mx-auto">
        <i class="fa-solid fa-check"></i>
      </div>
      <div>
        <h4 class="text-sm font-black text-emerald-800">Password Successfully Changed!</h4>
        <p class="text-xs text-slate-600 mt-1">Aapka naya password update ho gaya hai. Ab aap app mein login kar sakte hain.</p>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABmYgOsai5ppKsAqxGr212nZiMu9tsCjo",
      authDomain: "foodworldfixed.firebaseapp.com",
      databaseURL: "https://foodworldfixed-default-rtdb.firebaseio.com",
      projectId: "foodworldfixed",
      storageBucket: "foodworldfixed.firebasestorage.app",
      messagingSenderId: "357094358614",
      appId: "1:357094358614:web:e405d802735e15f4fbc5f7"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get('oobCode');

    async function initResetFlow() {
      const verifyingBox = document.getElementById('verifyingBox');
      const form = document.getElementById('newPasswordForm');
      const errorBox = document.getElementById('errorStateBox');
      const emailPreview = document.getElementById('userEmailPreview');

      if (!oobCode) {
        verifyingBox.classList.add('hidden');
        errorBox.classList.remove('hidden');
        document.getElementById('errorMessage').innerText = "Password reset code URL mein nahi mila.";
        return;
      }

      try {
        const email = await auth.verifyPasswordResetCode(oobCode);
        verifyingBox.classList.add('hidden');
        emailPreview.innerText = `Account: ${email}`;
        form.classList.remove('hidden');
      } catch (err) {
        verifyingBox.classList.add('hidden');
        errorBox.classList.remove('hidden');
        document.getElementById('errorMessage').innerText = err.message || "Link expire ho chuki hai. Kripya naya link mangwayein.";
      }
    }

    async function handleConfirmPasswordReset(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmNewPassword').value;
      const formErr = document.getElementById('formError');
      const btn = document.getElementById('savePassBtn');
      formErr.classList.add('hidden');

      if (p1 !== p2) {
        formErr.innerText = "Dono passwords match nahi kar rahe!";
        formErr.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating Password...';

      try {
        await auth.confirmPasswordReset(oobCode, p1);
        document.getElementById('newPasswordForm').classList.add('hidden');
        document.getElementById('successStateBox').classList.remove('hidden');
      } catch (err) {
        formErr.innerText = err.message || "Password save nahi ho paya.";
        formErr.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Save New Password</span>';
      }
    }

    window.onload = initResetFlow;
  </script>
</body>
</html>
